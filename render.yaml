services:
  - type: web
    name: tg-bot-questionnaire
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: BOT_TOKEN
        sync: false  # Ручное заполнение через UI
      - key: DEBUG
        value: "True"
      - key: WEBHOOK_URL
        value: https://srv-d0a80i3uibrs73baohsg.onrender.com
      # Нижеприведенные настройки должны подтягиваться автоматически
      - key: POSTGRES_DB
        fromDatabase:
          name: tg-bot-db
          property: database
      - key: POSTGRES_HOST
        fromDatabase:
          name: tg-bot-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: tg-bot-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: tg-bot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: tg-bot-db
          property: password

databases:
  - name: tg-bot-db
    databaseName: quiz_bot
    user: postgres
    ipAllowList: # разрешаем доступ для Render services
      - source: 0.0.0.0/0
        description: "Allow connections from anywhere (not recommended for production)"
    plan: free