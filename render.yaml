services:
  # Telegram бот сервис
  - type: worker
    name: tg-bot-questionnaire
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: tg-bot-db
          property: database
      - key: POSTGRES_HOST
        fromDatabase:
          name: tg-bot-db
          property: host
      - key: POSTGRES_PORT
        value: "5432"
      - key: DEBUG
        value: "False"

databases:
  - name: tg-bot-db
    databaseName: quiz_bot
    user: postgres
    plan: free